[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-trial-matcher"
version = "0.1.0"
description = "Clinical Trial Eligibility Matcher using Neo4j, Snowflake, and LLMs"
requires-python = ">=3.11"
dependencies = [
    # Graph database
    "neo4j>=5.26.0",

    # Async HTTP client
    "httpx>=0.27.0",

    # Settings & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # API framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # LLM providers
    "openai>=1.35.0",
    "anthropic>=0.30.0",

    # Snowflake
    "snowflake-connector-python[pandas]>=3.11.0",

    # Data processing
    "pandas>=2.2.0",
    "rapidfuzz>=3.9.0",

    # Frontend
    "streamlit>=1.36.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "data_ingestion",
    "snowflake_etl",
    "kg_builder",
    "nlp",
    "matcher",
    "llm",
    "api",
    "frontend",
]
